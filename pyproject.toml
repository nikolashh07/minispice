[project]
name = "minispice"
version = "1.0.0"
description = "A Python circuit simulator that solves circuits with circuit laws and explains each step."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
# Puts the project root on the import path so tests can `import minispice`.
pythonpath = ["."]
testpaths = ["tests"]
