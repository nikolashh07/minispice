<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniSpice Breadboard</title>
  <style>
    :root { --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #5d6676; --line: #d6dae1; --accent: #1f6feb; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #12151b; --panel: #1a1e26; --ink: #e4e8ef; --muted: #9aa3b2; --line: #2d3340; --accent: #4c8dff; color-scheme: dark; }
    }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
    #view { position: relative; min-height: 0; }
    aside { background: var(--panel); border-left: 1px solid var(--line); padding: 12px 16px; overflow-y: auto; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    #title { color: var(--muted); margin: 0 0 12px; }
    ol { padding-left: 20px; }
    li { margin-bottom: 8px; cursor: pointer; }
    li:hover { color: var(--accent); }
    .error { color: #c62828; }
    #tip { position: fixed; background: #222; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
    a { color: var(--accent); }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } aside { border-left: none; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>
  <aside>
    <h1>Build it on a breadboard</h1>
    <p id="title">Your circuit</p>
    <p>Drag to turn the board, scroll to zoom. Click a step to light up that part.</p>
    <ol id="steps"></ol>
    <p><label>Open a design or netlist: <input id="file" type="file" accept=".json,.cir,.txt"></label></p>
    <p><a href="../index.html">Back to the editor</a></p>
  </aside>
  <div id="tip" hidden></div>
  <script type="module" src="breadboard.js"></script>
</body>
</html>
